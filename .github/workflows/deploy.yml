name: CD — Deploy Frontend & Smart Contract

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # ── Frontend CD: GitHub Pages ─────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Build
        working-directory: frontend
        # Pass the repo name as the base path so assets load correctly on GitHub Pages
        run: |
          npx vite build --base=/AegisPay/
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'frontend/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ── Smart Contract CD: Stellar Testnet ───────────────────────────────────
  deploy-contract:
    name: Deploy Smart Contract to Stellar Testnet
    runs-on: ubuntu-latest
    env:
      NETWORK: testnet
      RPC_URL: https://soroban-testnet.stellar.org
      NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # soroban-sdk 22.x requires Rust 1.84+ and the wasm32v1-none target.
      # wasm32-unknown-unknown is no longer supported for Soroban WASM builds.
      - name: Install Rust stable (1.84+)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache Rust build artefacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/verifier/target
          key: ${{ runner.os }}-cargo-cd-${{ hashFiles('contracts/verifier/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-cd-

      - name: Build WASM
        working-directory: contracts/verifier
        run: cargo build --release --target wasm32v1-none

      - name: Install Stellar CLI
        run: |
          LATEST_URL=$(curl -sSL https://api.github.com/repos/stellar/stellar-cli/releases/latest | jq -r '.assets[] | select(.name | contains("x86_64-unknown-linux-gnu.tar.gz")) | .browser_download_url')
          curl -sSL $LATEST_URL | tar -xz -C /usr/local/bin
          stellar --version

      - name: Import deployer keypair
        run: |
          stellar keys add deployer --secret-key "${{ secrets.STELLAR_SECRET_KEY }}"

      - name: Fund deployer account on Testnet (friendbot)
        run: |
          PUBLIC_KEY=$(stellar keys public-key --account deployer)
          echo "Deployer public key: $PUBLIC_KEY"
          curl -s "https://friendbot.stellar.org?addr=${PUBLIC_KEY}" | jq -r '.result.hash // "Already funded"'

      - name: Deploy contract to Testnet
        id: deploy
        working-directory: contracts/verifier
        run: |
          WASM=target/wasm32v1-none/release/soroban_zk_verifier.wasm
          CONTRACT_ID=$(stellar contract deploy \
            --wasm $WASM \
            --source deployer \
            --network testnet \
            --rpc-url $RPC_URL \
            --network-passphrase "$NETWORK_PASSPHRASE")
          echo "CONTRACT_ID=$CONTRACT_ID" >> $GITHUB_OUTPUT
          echo "✅ Deployed contract: $CONTRACT_ID"

      - name: Print deployed contract address
        run: |
          echo "### Smart Contract Deployed 🎉" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Network:** Stellar Testnet" >> $GITHUB_STEP_SUMMARY
          echo "**Contract ID:** \`${{ steps.deploy.outputs.CONTRACT_ID }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Explorer:** https://stellar.expert/explorer/testnet/contract/${{ steps.deploy.outputs.CONTRACT_ID }}" >> $GITHUB_STEP_SUMMARY
