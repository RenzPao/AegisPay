name: CD — Deploy Frontend & Smart Contract

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # ── Frontend CD: GitHub Pages ─────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Build
        working-directory: frontend
        # Pass the repo name as the base path so assets load correctly on GitHub Pages
        run: |
          npx vite build --base=/AegisPay/
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'frontend/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ── Smart Contract CD: Stellar Testnet ───────────────────────────────────
  deploy-contract:
    name: Deploy Smart Contract to Stellar Testnet
    runs-on: ubuntu-latest
    # Only deploy the contract when contract source changes
    # and only if STELLAR_SECRET_KEY is configured in repository secrets
    if: |
      github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    env:
      NETWORK: testnet
      RPC_URL: https://soroban-testnet.stellar.org
      NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable + WASM target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build artefacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/verifier/target
          key: ${{ runner.os }}-cargo-cd-${{ hashFiles('contracts/verifier/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-cd-

      - name: Build WASM
        working-directory: contracts/verifier
        run: cargo build --release --target wasm32-unknown-unknown

      - name: Optimise WASM (strip + shrink)
        run: |
          cargo install wasm-opt --quiet 2>/dev/null || true
          WASM=contracts/verifier/target/wasm32-unknown-unknown/release/soroban_zk_verifier.wasm
          wasm-opt -Oz --strip-debug -o $WASM $WASM 2>/dev/null || echo "wasm-opt not available, skipping"

      - name: Install Stellar CLI
        run: |
          curl -sSL https://github.com/stellar/stellar-cli/releases/latest/download/stellar-cli-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C /usr/local/bin
          stellar --version

      - name: Fund deployer account on Testnet (friendbot)
        # Only needed the first time; safe to call repeatedly
        run: |
          PUBLIC_KEY=$(stellar keys public-key --account deployer 2>/dev/null || echo "")
          if [ -z "$PUBLIC_KEY" ]; then
            echo "Deriving public key from secret..."
            stellar keys import deployer --secret-key "${{ secrets.STELLAR_SECRET_KEY }}"
          fi
          PUBLIC_KEY=$(stellar keys public-key --account deployer)
          curl -s "https://friendbot.stellar.org?addr=${PUBLIC_KEY}" | jq -r '.result.hash // "Already funded or error"'

      - name: Deploy contract to Testnet
        id: deploy
        run: |
          WASM=contracts/verifier/target/wasm32-unknown-unknown/release/soroban_zk_verifier.wasm
          CONTRACT_ID=$(stellar contract deploy \
            --wasm $WASM \
            --source deployer \
            --network testnet \
            --rpc-url $RPC_URL \
            --network-passphrase "$NETWORK_PASSPHRASE")
          echo "CONTRACT_ID=$CONTRACT_ID" >> $GITHUB_OUTPUT
          echo "✅ Deployed contract: $CONTRACT_ID"

      - name: Print deployed contract address
        run: |
          echo "### Smart Contract Deployed 🎉" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Network:** Stellar Testnet" >> $GITHUB_STEP_SUMMARY
          echo "**Contract ID:** \`${{ steps.deploy.outputs.CONTRACT_ID }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Explorer:** https://stellar.expert/explorer/testnet/contract/${{ steps.deploy.outputs.CONTRACT_ID }}" >> $GITHUB_STEP_SUMMARY
