name: CI — Lint, Test & Build

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  # ── Frontend CI ─────────────────────────────────────────────────────────────
  frontend-ci:
    name: Frontend — Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Build (type-check + bundle)
        run: npx vite build --base=/AegisPay/

  # ── Smart Contract CI ────────────────────────────────────────────────────────
  contract-ci:
    name: Smart Contract — Build, Test & Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/verifier

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - name: Cache Rust build artefacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/verifier/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/verifier/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Format check
        run: cargo fmt --check

      - name: Clippy (warnings as errors)
        run: cargo clippy --features testutils -- -D warnings

      - name: Unit tests
        run: cargo test --features testutils

      - name: Build WASM release artefact
        run: cargo build --release --target wasm32-unknown-unknown

      - name: Upload WASM artefact
        uses: actions/upload-artifact@v4
        with:
          name: aegispay-verifier-wasm
          path: contracts/verifier/target/wasm32-unknown-unknown/release/soroban_zk_verifier.wasm
          retention-days: 7
